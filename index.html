<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ASSETS/reset.css">
    <link rel="stylesheet" href="ASSETS/variables.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="ASSETS/CSS/IMAGES/LOGOS/logo_achete_ton_film.png" />
    <title>AcheteTonFilmFR</title>
</head>
<body>
    <div class="navbar">
        <a href=""><img src="ASSETS/CSS/IMAGES/LOGOS/logo_achete_ton_film_.jpg" alt="logo_achete_ton_film" width="300"></a>
        <a href="" class="text_on_navbar">Accueil</a>
        <a href="" class="text_on_navbar">Catégories</a>
        <a href="" class="text_on_navbar">Support</a>
        <a href=""><img src="ASSETS/CSS/IMAGES/LOGOS/basket_logo.png" alt="shopping_logo" width="90"></a>
    </div>

    <div class="first_block">
        <div class="one_block"> <!-- Flex : texte à gauche (flex column) et photo à droite -->
            <h1>Bienvenue,<br><span>Cinéphile !</span></h1>
            <h2>Achetez des films disponibles <br> sur notre catalogue à n'importe quel moment de l'année !</h2>
            <div id="bouton_accueil">
                <a href="">Acheter Maintenant <i class="fa-solid fa-arrow-right-long">→</i></a>
            </div>
        </div>

        <div class="image_accueil_de_droite"><img src="ASSETS/CSS/IMAGES/BACKGROUND/image_accueil_achete_ton_site.jpg" alt="image_accueil_achete_ton_site" width="1500"></div>
    </div>

    <div class="second_block">
            <div class="categories">
                <a href=""><img src="ASSETS/CSS/IMAGES/LOGOS/CATEGORIES/fantasy.png" alt="categorie_fantasy" width="420"></a>
                <a href=""><img src="ASSETS/CSS/IMAGES/LOGOS/CATEGORIES/science_fiction.png" alt="categorie_sf" width="420"></a>
                <a href=""><img src="ASSETS/CSS/IMAGES/LOGOS/CATEGORIES/thriller.png" alt="categorie_fantasy" width="420"></a>
                <a href=""><img src="ASSETS/CSS/IMAGES/LOGOS/CATEGORIES/comedie.png" alt="categorie_fantasy" width="420"></a>
            </div>
    </div>



    <div class="previsu_films"> <!-- Colonne de flexbox en ligne -->

        <!--
           - affiche du film
           - titre du film
           - hover scale
           - affiche cliquable
        -->
        <a href=""><img src="ASSETS/CSS/IMAGES/FILMS/FANTASY/affiche_lotr1.jpeg" alt="lotr_affiche"><h2>The Lord of The Rings</h2></a>
        <a href=""><img src="ASSETS/CSS/IMAGES/FILMS/FANTASY/affiche_the_shape_of_water.jpg" alt="shape_of_water_affiche"><h2>The Shape of Water</h2></a>
        <a href=""><img src="ASSETS/CSS/IMAGES/FILMS/FANTASY/affiche_interstellar.jpg" alt="interstellar_affiche"><h2>Interstellar<br>(2014)</h2></a>
        <a href=""><img src="ASSETS/CSS/IMAGES/FILMS/FANTASY/affiche_project_hail_mary.jpg" alt="project_hail_mary_affiche"><h2>Project <br>Hail Mary</h2></a>
        <a href=""><img src="ASSETS/CSS/IMAGES/FILMS/FANTASY/affiche_shutter_island.jpg" alt="shutter_island_affiche"><h2>Shutter <br> Island</h2></a>
        <a href=""><img src="ASSETS/CSS/IMAGES/FILMS/FANTASY/affiche_prisoners.jpg" alt="prisoners_affiche"><h2>Prisoners<br>(2013)</h2></a>



    </div>

</body>
</html>
